[project]
name = "claude-code-tutorial"
version = "0.1.0"
description = "《从 0 到 1 30 天实现 Claude Code》教程"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "tiktoken>=0.7.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "textual>=0.80.0",
    "ruff>=0.6.0",
    "pytest>=8.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
